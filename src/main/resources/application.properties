spring.application.name=Caryanam_Bidding

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/new_caryanam?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.main.banner-mode=off
logging.level.root=OFF

jwt.secret=1234567890123456789012345678901234567890123456789012345678901234
jwt.expiration=86400000

app.base-url=http://localhost:8080
app.upload-dir=uploads
app.car-image-folder=car/images
app.car-video-folder=car/videos

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
